<style>
  .lg-wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

  .tile { overflow: hidden; display: block; }

  .look { animation: look 5s ease-in-out infinite; } @keyframes look { 0%, 40%, 100% { transform: translate(0, 0); } 50%, 80% { transform: translate(3px, 1px); } }

  .sway { animation: sway 3.2s ease-in-out infinite; transform-origin: 34px 16px; transform-box: view-box; } @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }

<h2>歪头版，学参考图的做法</h2>
<p class="subtitle">参考图好在三点：角色撑满整个图标、被下边缘裁掉一截（像从底下探出头）；头歪着、眼睛往上看，有表情；除了眼睛几乎什么都没有。这里去掉了耳朵，只保留一片嫩芽作为“果园”的记号。三种配色，同一个角色。</p>

    <h3>1 · 深色底，橙色小家伙</h3><p>和参考图最接近，在深色和浅色界面里都显眼。</p>
    <div class="hero"><svg class="tile" width="150" height="150"><use href="#t1"/></svg></div>

  </div>
