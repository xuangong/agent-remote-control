services:
  agents:
    image: ${AGENT_REMOTE_IMAGE:?Set the built Node Relay image}
    environment:
      AGENT_REMOTE_RELAY_URL: ${AGENT_REMOTE_RELAY_URL:?Set the public Relay origin}
      AGENT_REMOTE_PREVIEW_URL: ${AGENT_REMOTE_PREVIEW_URL:-}
      AGENT_REMOTE_PREVIEW_DOMAIN: ${AGENT_REMOTE_PREVIEW_DOMAIN:-}
      AGENT_REMOTE_ISSUER: ${AGENT_REMOTE_ISSUER:?Set the canonical Gateway issuer}
      AGENT_REMOTE_SIGNING_SECRET: ${AGENT_REMOTE_SIGNING_SECRET:?Set the shared signing secret}
      AGENT_REMOTE_PORT: 5910
    ports:
      - "127.0.0.1:${AGENT_REMOTE_PORT:-5910}:5910"
    volumes:
      - agents-state:/data
    restart: unless-stopped

volumes:
  agents-state:
