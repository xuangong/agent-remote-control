<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot / Window 工作台 · 流程演示</title>
<style>
/* Tokens copied from packages/agent-remote-lab/src/ui/tokens.css so the study matches the product. */
:root {
  color-scheme: light dark;
  --ui-background: #ffffff; --ui-background-grouped: #f2f2f7; --ui-sidebar: #f2f2f7; --ui-selection: #e8f0fc;
  --ui-label: #1d1d1f; --ui-label-secondary: #636366; --ui-label-tertiary: #aeaeb2;
  --ui-separator: rgb(60 60 67 / 0.18); --ui-fill: rgb(120 120 128 / 0.12); --ui-fill-strong: rgb(120 120 128 / 0.2);
  --ui-segment-selected: #ffffff; --ui-accent: #0071e3; --ui-accent-text: #0066cc; --ui-row-hover: rgb(120 120 128 / 0.12);
  --ui-status-attention: #c93400; --ui-status-working: #0066cc; --ui-status-success: #1a7431; --ui-status-failure: #d70015;
  --ui-shadow-pane: 0 1px 3px rgb(0 0 0 / 0.08), 0 0 0 0.5px rgb(0 0 0 / 0.06);
  --ui-shadow-overlay: 0 12px 40px rgb(0 0 0 / 0.16), 0 0 0 0.5px rgb(0 0 0 / 0.1);
  --ui-radius-control: 6px; --ui-radius-pane: 10px; --ui-radius-input: 18px;
  --ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --ui-font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --ui-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  /* Session View surface, as the Lab themes it today. */
  --sv-user: #e8f0fc; --sv-user-border: #c9dcf6; --sv-rule: rgb(60 60 67 / 0.12);
  --page: #e9e9ee; --note: #ffffff; --pin: #0071e3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ui-background: #1c1c1e; --ui-background-grouped: #000000; --ui-sidebar: #2c2c2e; --ui-selection: #16304d;
    --ui-label: #f5f5f7; --ui-label-secondary: #98989d; --ui-label-tertiary: #636366;
    --ui-separator: rgb(255 255 255 / 0.15); --ui-fill: rgb(118 118 128 / 0.24); --ui-fill-strong: rgb(118 118 128 / 0.36);
    --ui-segment-selected: #636366; --ui-accent-text: #409cff; --ui-row-hover: rgb(118 118 128 / 0.06);
    --ui-status-attention: #ffb340; --ui-status-working: #409cff; --ui-status-success: #30d158; --ui-status-failure: #ff6961;
    --ui-shadow-pane: 0 1px 3px rgb(0 0 0 / 0.4), 0 0 0 0.5px rgb(255 255 255 / 0.08);
    --ui-shadow-overlay: 0 12px 40px rgb(0 0 0 / 0.5), 0 0 0 0.5px rgb(255 255 255 / 0.12);
    --sv-user: #16304d; --sv-user-border: #24476e; --sv-rule: rgb(255 255 255 / 0.1);
    --page: #111113; --note: #1c1c1e; --pin: #409cff;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 var(--ui-font); color: var(--ui-label); background: var(--page); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
svg.i { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* Review layout */
.study { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100%; }
.notes { overflow: auto; padding: 28px 24px 40px; background: var(--note); border-right: 0.5px solid var(--ui-separator); }
.notes h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.01em; }
.notes .lead { margin: 0 0 20px; color: var(--ui-label-secondary); font-size: 13px; }
.scenes { list-style: none; margin: 0 0 22px; padding: 0; display: grid; gap: 2px; }
.scenes button { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: baseline; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
.scenes button:hover { background: var(--ui-row-hover); }
.scenes button[aria-current="step"] { background: var(--ui-selection); }
.scenes b { font-weight: 600; font-size: 13px; color: var(--ui-label-secondary); font-variant-numeric: tabular-nums; }
.scenes span { font-size: 14px; }
.detail h2 { margin: 0 0 6px; font-size: 16px; }
.detail p { margin: 0 0 14px; font-size: 13px; color: var(--ui-label-secondary); }
.detail h3 { margin: 18px 0 6px; font-size: 12px; font-weight: 600; color: var(--ui-label-secondary); }
.detail ol, .detail ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 8px; font-size: 13px; }
.detail ol li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; }
.detail ul li { padding-left: 14px; position: relative; color: var(--ui-label-secondary); }
.detail ul li::before { content: ""; position: absolute; left: 3px; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--ui-label-tertiary); }
.n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--pin); color: #fff; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stage { position: relative; overflow: auto; display: grid; place-items: center; padding: 28px; }
.devices { display: flex; gap: 60px; padding-left: 36px; align-items: flex-start; transform-origin: top center; }
.caption { margin: 0 0 28px; font-size: 12px; color: var(--ui-label-secondary); text-align: center; }

/* Device frames */
.desktop { width: 1180px; height: 720px; border-radius: 12px; overflow: hidden; background: var(--ui-background); box-shadow: var(--ui-shadow-overlay); display: grid; grid-template-columns: 284px minmax(0, 1fr); position: relative; }
.phone { width: 390px; height: 800px; border-radius: 44px; padding: 12px; background: #1d1d1f; box-shadow: var(--ui-shadow-overlay); }
.phone .screen { position: relative; height: 100%; border-radius: 34px; overflow: hidden; background: var(--ui-background); display: flex; flex-direction: column; }
.battery { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; opacity: .85; background: linear-gradient(90deg, currentColor 70%, transparent 70%) content-box; padding: 1.5px; }
.statusbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 30px; font-size: 14px; font-weight: 600; }

/* Shell */
.sidebar { background: var(--ui-sidebar); border-right: 0.5px solid var(--ui-separator); display: flex; flex-direction: column; min-height: 0; }
.sidebar-head { height: 52px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px; }
.segmented { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 8px; background: var(--ui-fill); min-width: 160px; }
.segmented span { position: relative; padding: 3px 14px; border-radius: 6px; font-size: 13px; text-align: center; color: var(--ui-label); }
.segmented span[aria-current] { background: var(--ui-segment-selected); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); font-weight: 600; }
.icon-btn { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: var(--ui-radius-control); background: transparent; color: var(--ui-label-secondary); }
.icon-btn:hover { background: var(--ui-row-hover); }
.spacer { flex: 1; }
.roster { flex: 1; overflow: auto; padding: 4px 8px 16px; }

.group { margin-top: 10px; }
.group-head { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px 0 4px; color: var(--ui-label-secondary); font-size: 12px; font-weight: 600; }
.group-head svg { color: var(--ui-label-tertiary); }
.group-head .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quiet-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ui-status-attention); opacity: .75; }

.bot { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; width: 100%; min-height: 56px; padding: 8px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; transition: background var(--ui-ease) 150ms, opacity 200ms; }
.bot:hover { background: var(--ui-row-hover); }
.bot[aria-current] { background: var(--ui-selection); }
.bot .line { display: flex; align-items: center; gap: 6px; min-width: 0; }
.bot .name { flex: 0 1 auto; min-width: 4.5em; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bot .tag { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row-menu { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--ui-fill-strong); color: var(--ui-label); }
.bot[data-unread] .name { font-weight: 650; }
.bot .preview { font-size: 13px; color: var(--ui-label-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bot .meta { display: grid; justify-items: end; gap: 4px; align-self: stretch; padding-top: 2px; }
.bot time { font-size: 11px; color: var(--ui-label-secondary); font-variant-numeric: tabular-nums; }
.unread { width: 8px; height: 8px; border-radius: 50%; background: var(--ui-accent); }
.needs { font-size: 11px; font-weight: 600; color: var(--ui-status-attention); white-space: nowrap; }
.bot[data-asleep] { opacity: .5; }
.bot[data-asleep] .preview { display: flex; align-items: center; gap: 4px; }
.bot[data-new] { animation: arrive 600ms var(--ui-ease) both; }
@keyframes arrive { from { opacity: 0; transform: translateY(-6px); background: var(--ui-selection); } }

.avatar { position: relative; display: grid; place-items: center; width: var(--s, 34px); height: var(--s, 34px); border-radius: 50%; background: var(--c, #0071e3); color: #fff; font-size: calc(var(--s, 34px) * 0.42); font-weight: 600; flex: none; }
.avatar[data-ink="dark"] { color: #1d1d1f; }
.avatar .presence { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ui-sidebar); background: var(--ui-status-working); }

.tag { flex: none; padding: 0 5px; border-radius: 4px; background: var(--ui-fill); color: var(--ui-label-secondary); font-size: 11px; font-weight: 500; line-height: 17px; white-space: nowrap; }

.typing { display: inline-flex; gap: 3px; align-items: center; }
.typing i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .3; animation: typing 1.2s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes typing { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: .9; transform: translateY(-1.5px); } }
.preview.working { color: var(--ui-status-working); display: flex; align-items: center; gap: 6px; }

.ask { display: flex; align-items: center; gap: 6px; margin: -2px 0 4px 54px; padding: 4px 8px; border-radius: 6px; font-size: 12px; color: var(--ui-label-secondary); }
.ask:hover { background: var(--ui-row-hover); }

.other { margin-top: 14px; }
.footer { flex: none; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-top: 0.5px solid var(--ui-separator); font-size: 13px; color: var(--ui-label-secondary); }
.online { width: 7px; height: 7px; border-radius: 50%; background: var(--ui-status-success); }

/* Conversation */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--ui-background); }
.toolbar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 0.5px solid var(--ui-separator); }
.toolbar .who { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 15px; font-weight: 600; }
.sv { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.sv-head { height: 44px; flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border-bottom: 0.5px solid var(--sv-rule); font-size: 13px; color: var(--ui-label-secondary); }
.sv-head .left { margin-right: auto; } .sv-head .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.sv-body { flex: 1; overflow: hidden; padding: 12px 0; }
.sv-col { max-width: 760px; margin: 0 auto; padding: 0 24px; }
.entry { padding: 12px 14px; margin-bottom: 14px; }
.entry header { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--ui-label-secondary); }
.entry header time { font: 500 10.5px var(--ui-font-mono); }
.entry p { margin: 0; font-size: 14px; line-height: 1.6; }
.entry.user { margin-left: 25%; border: 1px solid var(--sv-user-border); border-radius: 8px; background: var(--sv-user); }
.entry.assistant { padding-left: 0; }
.entry.pending { opacity: .62; }
.delivery { display: flex; align-items: center; gap: 6px; margin: -6px 0 16px 25%; padding-left: 2px; font-size: 12px; color: var(--ui-label-secondary); }
.delivery .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.delivery button { border: 0; padding: 0; background: none; color: var(--ui-accent-text); cursor: pointer; font-size: 12px; }
.notice { display: flex; gap: 8px; align-items: center; margin: 0 0 14px; font-size: 12px; color: var(--ui-label-secondary); }
.reply-presence { display: flex; align-items: center; gap: 8px; height: 28px; margin: -4px 0 12px; color: var(--ui-label-secondary); font-size: 12px; }
.reply-presence .bubble { display: inline-flex; align-items: center; padding: 8px 12px; border-radius: 14px; background: var(--ui-fill); color: var(--ui-label-secondary); }
.history-divider { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; font-size: 11px; color: var(--ui-label-tertiary); }
.history-divider::before, .history-divider::after { content: ""; flex: 1; height: 0.5px; background: var(--ui-separator); }
.earlier { opacity: .78; }
.composer { flex: none; margin: 0 auto 14px; width: min(760px, calc(100% - 48px)); border: 1px solid var(--ui-separator); border-radius: 12px; background: var(--ui-background); padding: 14px 14px 10px; }
.composer .placeholder { height: 22px; color: var(--ui-label-tertiary); font-size: 14px; }
.composer .row { display: flex; align-items: center; gap: 18px; margin-top: 10px; font-size: 12.5px; color: var(--ui-label); }
.composer .send { margin-left: auto; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--ui-fill); color: var(--ui-label-tertiary); }

.card { margin: 0 0 16px; border: 1px solid var(--ui-separator); border-radius: 10px; padding: 12px 14px; background: var(--ui-background); }
.card h4 { margin: 0 0 6px; font-size: 13px; }
.card p { margin: 0 0 10px; font-size: 13px; color: var(--ui-label-secondary); }
.card .actions { display: flex; gap: 8px; }
.btn { border: 0; border-radius: 7px; padding: 5px 12px; background: var(--ui-fill); font-size: 13px; }
.btn.primary { background: var(--ui-accent); color: #fff; }

.menu { position: absolute; z-index: 5; left: 0; top: 0; width: 220px; padding: 5px; border-radius: 10px; background: var(--ui-background); box-shadow: var(--ui-shadow-overlay); font-size: 13px; }
.menu div { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; }
.menu div:hover, .menu div[data-hot] { background: var(--ui-accent); color: #fff; }
.menu hr { border: 0; height: 0.5px; margin: 4px 6px; background: var(--ui-separator); }
.popover { position: absolute; z-index: 5; left: 0; top: 0; width: 250px; padding: 12px 14px; border-radius: 12px; background: var(--ui-background); box-shadow: var(--ui-shadow-overlay); font-size: 12.5px; }
.popover dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
.popover dt { color: var(--ui-label-secondary); } .popover dd { margin: 0; }

/* Window mode */
.win-head { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 0.5px solid var(--ui-separator); }
.win-head h2 { margin: 0; font-size: 15px; } .win-head small { color: var(--ui-label-secondary); font-size: 12px; }
.canvas { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 8px; background: var(--ui-background-grouped); }
.pane { display: flex; flex-direction: column; width: 520px; flex: none; border-radius: var(--ui-radius-pane); background: var(--ui-background); box-shadow: var(--ui-shadow-pane); overflow: hidden; }
.pane .sv-col { padding: 0 16px; }
.pane-head { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border-bottom: 0.5px solid var(--sv-rule); font-size: 13px; }
.pane-head .title { font-weight: 600; } .pane-head .grow { flex: 1; }
.strip { width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; border-radius: var(--ui-radius-pane); background: var(--ui-background); box-shadow: var(--ui-shadow-pane); cursor: pointer; transition: transform 150ms var(--ui-ease), opacity 200ms; }
.strip:hover { transform: translateY(-1px); }
.strip .vname { writing-mode: vertical-rl; font-size: 13px; font-weight: 500; letter-spacing: .04em; max-height: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip .vtag { writing-mode: vertical-rl; }
.strip[data-asleep] { opacity: .5; }
.strip .state { font-size: 11px; font-weight: 600; color: var(--ui-status-attention); writing-mode: vertical-rl; }
.strip .typing { color: var(--ui-status-working); }
.wake { animation: wake 500ms var(--ui-ease) both; }
@keyframes wake { from { opacity: .4; transform: scale(.985); } }

/* Phone */
.ph-nav { flex: none; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; }
.ph-title { padding: 2px 18px 8px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.ph-search { margin: 0 16px 6px; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 10px; background: var(--ui-fill); color: var(--ui-label-secondary); font-size: 15px; }
.phone .roster { padding: 0 8px; }
.phone .bot { min-height: 64px; grid-template-columns: 44px minmax(0, 1fr) auto; }
.phone .bot .name { font-size: 16px; } .phone .bot .preview { font-size: 14px; }
.phone .group-head { font-size: 13px; height: 34px; }
.ph-chat-head { flex: none; display: flex; align-items: center; gap: 6px; height: 50px; padding: 0 10px 0 4px; border-bottom: 0.5px solid var(--ui-separator); }
.ph-back { display: flex; align-items: center; gap: 0; padding: 6px 4px; color: var(--ui-accent-text); font-size: 17px; }
.phone .sv-col { padding: 0 14px; }
.phone .entry.user { margin-left: 12%; }
.phone .delivery { margin-left: 12%; }
.phone .composer { width: calc(100% - 20px); margin-bottom: 18px; }
.home-bar { flex: none; height: 22px; display: grid; place-items: center; } .home-bar::after { content: ""; width: 120px; height: 5px; border-radius: 3px; background: var(--ui-label); opacity: .85; }


/* Host overview */
.hosts-grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; align-content: start; padding: 16px; background: var(--ui-background-grouped); }
.host-card { display: grid; gap: 12px; align-content: start; padding: 14px; border-radius: 12px; background: var(--ui-background); box-shadow: var(--ui-shadow-pane); }
.host-card header { display: flex; align-items: center; gap: 10px; color: var(--ui-label-tertiary); }
.host-card header div { flex: 1; min-width: 0; }
.host-card h3 { margin: 0; font-size: 15px; color: var(--ui-label); }
.host-card header small { display: block; color: var(--ui-label-secondary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.host-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ui-label-tertiary); flex: none; }
.host-dot.on { background: var(--ui-status-success); }
.host-card.offline { opacity: .6; }
.host-sessions { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px; }
.host-sessions b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.host-sessions span { font-size: 13px; color: var(--ui-label-secondary); }
.host-sessions small { flex-basis: 100%; font-size: 12px; color: var(--ui-label-secondary); }
.host-sessions em { font-style: normal; color: var(--ui-status-attention); font-weight: 600; }
.metrics { display: grid; gap: 10px; }
.metrics.compact { grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.meter-line { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ui-label-secondary); }
.meter-value { color: var(--ui-label); font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter-value.warn { color: var(--ui-status-attention); font-weight: 600; }
.bar { height: 4px; margin-top: 5px; border-radius: 2px; background: var(--ui-fill); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--ui-accent); }
.bar i.warn { background: var(--ui-status-attention); }
.host-note .btn { flex: none; white-space: nowrap; }
.host-note { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; font-size: 12px; color: var(--ui-label-secondary); }
.host-list { flex: 1; overflow: auto; display: grid; gap: 10px; align-content: start; padding: 4px 14px 16px; }
/* Numbered review markers */
.frame-wrap { position: relative; }
.frame-wrap > .kept-note { position: absolute; right: 2px; top: -22px; font-size: 12px; color: var(--ui-label-secondary); }
.pin { position: absolute; z-index: 6; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--pin); color: #fff; font-size: 12px; font-weight: 700; box-shadow: 0 0 0 3px color-mix(in srgb, var(--pin) 25%, transparent); pointer-events: none; }
.kept { position: absolute; z-index: 4; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ui-label) 8%, transparent); color: var(--ui-label-secondary); font-size: 11px; pointer-events: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 1000px) { .study { grid-template-columns: 1fr; height: auto; } .notes { border-right: 0; } }
</style>
</head>
<body>
<div class="study">
  <aside class="notes">
    <h1>Bot / Window 工作台</h1>

const sizeText = gb => gb >= 1000 ? `${(gb / 1024).toFixed(1)} TB` : `${Math.round(gb * 10) / 10} GB`;
function meter(label, value, total, text, key = '') {
  const ratio = Math.min(1, value / total), warn = ratio >= 0.9;
  return `<div class="meter"${key}><div class="meter-line"><span>${label}</span><span class="meter-value${warn ? ' warn' : ''}">${text}</span></div><div class="bar"><i style="width:${(ratio * 100).toFixed(1)}%"${warn ? ' class="warn"' : ''}></i></div></div>`;
}
function hostCard(host, compact = false) {
  const s = host.sessions, total = s ? s.working + s.waiting + s.idle : 0;
  const sessions = s ? `<div class="host-sessions"><b>${total}</b><span>个 session</span><small>${[s.working ? `${s.working} 工作中` : '', s.waiting ? `<em>${s.waiting} 需要你</em>` : '', s.idle ? `${s.idle} 空闲` : ''].filter(Boolean).join(' · ')}</small></div>` : '';

    : host.shared ? `<p class="host-note">共享的 Host 只显示 session 数。</p>` : !host.online ? `<p class="host-note">离线</p>` : '';
  return `<article class="host-card${host.online ? '' : ' offline'}" data-host="${host.id}"><header><span class="host-dot${host.online ? ' on' : ''}"></span><div><h3>${esc(host.name)}</h3><small>${esc(host.os)} · ${esc(host.version)}</small></div>${icon('chevron-right', 16)}</header>${sessions}${metrics}${note}</article>`;
}

const scenesEl = document.getElementById('scenes'), detailEl = document.getElementById('detail'), devices = document.getElementById('devices'), stage = document.getElementById('stage');
let current = 0;
function within(frame, element) {
  const a = frame.getBoundingClientRect(), b = element.getBoundingClientRect();
  return { left: b.left - a.left, top: b.top - a.top, right: b.right - a.left, bottom: b.bottom - a.top, width: b.width, height: b.height };
}
function placeOverlays() {
  devices.querySelectorAll('[data-anchor]').forEach(overlay => {
    const frame = overlay.closest('.desktop'), target = frame?.querySelector(overlay.dataset.anchor);
    if (!target) return;
    const r = within(frame, target);
    const place = overlay.dataset.place;
    overlay.style.left = `${place === 'right' ? r.right + 10 : r.left}px`;
    overlay.style.top = `${place === 'right' ? r.top - 6 : r.bottom + 6}px`;
  });
}
function placePins() {
  devices.querySelectorAll('.frame-wrap[data-pins]').forEach(wrap => {
    wrap.querySelectorAll('.pin').forEach(pin => pin.remove());
    const pins = JSON.parse(wrap.dataset.pins || '[]');
    const frame = wrap.querySelector('.desktop, .phone');
    for (const spec of pins) {
      const target = wrap.querySelector(spec.sel);
      if (!target) { console.error(`Missing pin target ${spec.sel}`); continue; }
      const r = within(wrap, target), f = within(wrap, frame);
      const pin = document.createElement('span');
      pin.className = 'pin'; pin.textContent = spec.n;
      const middle = r.top + r.height / 2 - 11;
      const [x, y] = spec.at === 'out' ? [f.left - 32, middle] : spec.at === 'right' ? [r.right + 8, middle] : spec.at === 'left' ? [r.left - 30, middle] : spec.at === 'corner' ? [r.right - 26, middle] : [r.left + r.width / 2 - 11, r.top - 28];
      pin.style.left = `${x}px`; pin.style.top = `${y}px`;
      wrap.append(pin);
    }
  });
}
function fit() {
  devices.style.transform = 'none';
  const scale = Math.min(1, (stage.clientWidth - 96) / devices.scrollWidth, (stage.clientHeight - 56) / devices.scrollHeight);
  devices.style.transform = `scale(${Math.max(scale, 0.45)})`;
}
function show(index) {
  current = index;
  scenesEl.querySelectorAll('button').forEach((button, i) => { if (i === index) button.setAttribute('aria-current', 'step'); else button.removeAttribute('aria-current'); });
  devices.style.transform = 'none';
  devices.innerHTML = SCENES[index].render();
  detailEl.innerHTML = SCENES[index].detail;
  placeOverlays(); placePins();
  history.replaceState(null, '', `#${index + 1}`);
  fit();
}
scenesEl.innerHTML = SCENES.map((scene, i) => `<li><button type="button"><b>${i + 1}</b><span>${esc(scene.title)}</span></button></li>`).join('');
scenesEl.querySelectorAll('button').forEach((button, i) => button.addEventListener('click', () => show(i)));
devices.addEventListener('click', event => {
  const target = event.target.closest('[data-strip]');
  if (target) { target.removeAttribute('data-asleep'); target.classList.add('wake'); }
});
document.addEventListener('keydown', event => {
  if (event.key === 'ArrowDown' || event.key === 'ArrowRight') show(Math.min(SCENES.length - 1, current + 1));
  if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') show(Math.max(0, current - 1));
});
addEventListener('resize', fit);
show(Math.min(SCENES.length - 1, Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1)));
</script>
