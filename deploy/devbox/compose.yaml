services:
  devbox:
    build:
      context: ../..
      dockerfile: Dockerfile.devbox
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://mirrors.cloud.tencent.com/npm/}
        SOURCE_REVISION: ${DEVBOX_SOURCE_REVISION:-0000000000000000000000000000000000000000}
        SOURCE_DIRTY: ${DEVBOX_SOURCE_DIRTY:-true}
        CODEX_VERSION: ${DEVBOX_CODEX_VERSION:-0.162.0}
        CLAUDE_VERSION: ${DEVBOX_CLAUDE_VERSION:-2.1.247}
        COPILOT_VERSION: ${DEVBOX_COPILOT_VERSION:-1.0.83}
        OPENCODE_VERSION: ${DEVBOX_OPENCODE_VERSION:-2.0.25}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEVBOX_PORT:-5910}:${DEVBOX_PORT:-5910}"
    environment:
      DEVBOX_PORT: ${DEVBOX_PORT:-5910}
      DEVBOX_ORIGIN: http://localhost:${DEVBOX_PORT:-5910}
    env_file:
      - path: ${DEVBOX_ENV_FILE:-./devbox.env}
        required: false
    volumes:
      - devbox-data:/data
      - devbox-home:/home/node
      - devbox-workspace:/workspace
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    stop_grace_period: 30s
volumes:
  devbox-data:
  devbox-home:
  devbox-workspace:
