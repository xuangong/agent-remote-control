name: Release Controller on GitHub

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified GitHub release (no npm publication)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-controller
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'xuangong/agent-remote-control' &&
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Validate release identity
        shell: bash
        run: |
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$RELEASE_TAG" =~ ^controller-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const { version } = JSON.parse(readFileSync("packages/agent-host/package.json", "utf8"));
            assert.equal(process.env.RELEASE_TAG, `controller-v${version}`);
          '
      - name: Install build tools and dependencies
        run: |
          npm install --global pnpm@10.34.5
          pnpm install --frozen-lockfile
      - run: pnpm compatibility:check
      - run: pnpm build:agent-remote-controller
      - name: Test Controller
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run([
              'pnpm', '--filter', '@orchardworks/agent-remote-controller',
              'test', '--hookTimeout=30000'
          ], timeout=240, check=True)
          PY
      - name: Test Windows Controller
        if: runner.os == 'Windows'
        run: pnpm test:windows
      - name: Test first-install script
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 - <<'PYTEST'
          import subprocess
          subprocess.run(['node', '--test', '--test-timeout=60000', 'scripts/controller/install.test.mjs'], timeout=180, check=True)
          PYTEST
      - run: pnpm test:agent-remote-controller-package
      - run: node scripts/controller-release.mjs
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: controller-github-package
          path: |
            dist/agent-remote-controller/*.tgz
            dist/agent-remote-controller/controller-release.json
            dist/agent-remote-controller/install.sh
            dist/agent-remote-controller/install.ps1
          if-no-files-found: error
          retention-days: 7

  release:
    if: inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: controller-github-package
          path: package
      - name: Upload all assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Controller ${RELEASE_TAG#controller-v}" \
            --notes 'Independent Controller updates with owner confirmation, verified packages and startup rollback. See docs/controller-updates.md for compatibility and bootstrap instructions.' \
            package/*.tgz package/controller-release.json package/install.sh package/install.ps1
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
